name: Send Bounty Proposals

on:
  push:
    paths:
      - 'data/bounty_manifest.json'
      - 'proposals/*.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  send-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Send bounty proposals via Gmail
        env:
          GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}
        run: python scripts/send_proposals.py

      - name: Check results
        run: |
          if [ -f data/sent_log.json ]; then
            echo "Email delivery results:"
            python -m json.tool data/sent_log.json
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "sparkbountybot"
          git config user.email "sparkbountybot@gmail.com"
          git add data/sent_log.json data/bounty_manifest.json
          git commit -m "📧 Email delivery results [${{ github.run_number }}]" || echo "No changes to commit"
          git push
