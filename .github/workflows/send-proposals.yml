name: Send Bounty Proposals

on:
  push:
    paths:
      - 'data/bounty_manifest.json'
      - 'proposals/*.md'
    # Only trigger on non-ACTION pushes (skip auto-pushes from this action)
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  send-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Send bounty proposals via Gmail
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_EMAIL: sparkbountybot@gmail.com
        run: python scripts/send_proposals.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "sparkbountybot"
          git config user.email "sparkbountybot@gmail.com"
          git add data/sent_log.json data/bounty_manifest.json
          git commit -m "📧 Email delivery results [run #${{ github.run_number }}]" || echo "No changes to commit"
          git push --quiet || echo "Push failed (may be empty commit)"
