name: Technical Trading Run

on:
  schedule:
    # Every 2 hours during market hours (Mon-Fri)
    - cron: '0 14,18,22,2 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  technical-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alpaca-py yfinance ta APScheduler pyyaml

      - name: Run Technical Trading
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          echo "=== Trading Run $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          python manager.py trade-scan

      - name: Commit state
        run: |
          git config user.name "BountyBot"
          git config user.email "bot@sparkbountybot.com"
          git add state/
          git commit -m "Auto-trade update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" || echo "No changes"
          git push || echo "Push failed"
