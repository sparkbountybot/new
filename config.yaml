# Configuration

github:
  org: sparkbountybot
  watch_interval_seconds: 300

gmail:
  email: your@gmail.com
  password: your-app-password
  check_interval_seconds: 300

trading:
  alpaca_api_key: your-api-key
  alpaca_secret_key: your-secret-key
